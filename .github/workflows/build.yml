name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Windows PowerShell 5.1
        shell: powershell
        run: .\Build.ps1

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\dist\API-Tester.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error "Line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host 'PowerShell 7 parse OK'

      - uses: actions/upload-artifact@v4
        with:
          name: API-Tester
          path: |
            dist/API-Tester.ps1
            dist/API-Tester.ps1.sha256
